<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Gate Login | Hostel E-Outpass</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .alert-banner-persistent {
      background-color: #fef2f2;
      border: 2px solid #ef4444;
      color: #991b1b;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.4;
      box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.15);
    }
    .alert-banner-persistent.hidden {
      display: none !important;
    }
    .alert-icon {
      flex-shrink: 0;
      color: #ef4444;
    }
    .demo-eval-card {
      margin-top: 1.5rem;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.85rem;
    }
    .demo-eval-title {
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.5rem;
      display: block;
    }
    .eval-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .eval-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .eval-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }
    .eval-btn.danger-eval {
      color: #b91c1c;
      border-color: #fca5a5;
    }
    .eval-btn.danger-eval:hover {
      background: #fef2f2;
    }
    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 1.25rem;
    }
    .back-home-link:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <span class="portal-badge">🚨 Gate Security Personnel Only</span>
        <div class="brand-icon-large" style="background: linear-gradient(135deg, #1e293b, #334155);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2>Gate Security Portal</h2>
        <p class="login-subtext">2-Phase Outpass Verification (Departure Exit & Return Entry)</p>
      </div>

      <!-- High-Visibility Persistent Error Alert Banner -->
      <div id="loginErrorBanner" class="alert-banner-persistent hidden" role="alert">
        <svg class="alert-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div class="alert-content">
          <span id="loginErrorText">Error message</span>
        </div>
      </div>

      <!-- Security Login Form -->
      <form id="securityLoginForm" class="login-form">
        <input type="hidden" id="targetRole" value="security">

        <div class="form-group">
          <label for="securityEmail">Security Guard ID or Gate Email *</label>
          <input type="text" id="securityEmail" placeholder="e.g. security.boys@college.edu or security.girls@college.edu" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="securityPassword">Password *</label>
          <input type="password" id="securityPassword" placeholder="Enter security guard password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="background-color: #1e293b;" id="btnSecurityLoginSubmit">
          <span>Sign In to Security Gate</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <!-- Quick Fill Evaluation Credentials -->
      <div class="demo-eval-card">
        <span class="demo-eval-title">⚡ Quick Gate Terminal Switch (For Testing & Verification):</span>
        <div class="eval-btn-group">
          <button type="button" class="eval-btn" onclick="fillSecurity('security.boys@college.edu', 'gate123')">
            🚹 Boys Gate (Officer Raman - SEC-BOYS)
          </button>
          <button type="button" class="eval-btn" onclick="fillSecurity('security.girls@college.edu', 'gate123')">
            🚺 Girls Gate (Officer Valli - SEC-GIRLS)
          </button>
        </div>
      </div>

      <div style="text-align: center;">
        <a href="index.html" class="back-home-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back to Central Portal Selection
        </a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("securityLoginForm");
    const emailInput = document.getElementById("securityEmail");
    const passwordInput = document.getElementById("securityPassword");
    const errorBanner = document.getElementById("loginErrorBanner");
    const errorText = document.getElementById("loginErrorText");

    function showError(message) {
      errorText.textContent = message;
      errorBanner.classList.remove("hidden");
    }

    function clearError() {
      errorBanner.classList.add("hidden");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, targetRole: "security" })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showError(data.message || data.error || "Authentication failed.");
          return;
        }

        // Store session and redirect to Security Gate Verification Interface
        localStorage.setItem("eop_user", JSON.stringify(data.user));
        localStorage.setItem("eop_token", data.token);
        window.location.href = "/security-gate.html";
      } catch (err) {
        showError("Connection error: Unable to contact server. Please verify backend is running.");
      }
    });

    window.fillSecurity = function(email, password) {
      emailInput.value = email;
      passwordInput.value = password;
      clearError();
    };
  </script>
</body>
</html>
